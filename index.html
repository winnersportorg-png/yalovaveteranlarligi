<!doctype html>
<html lang="tr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yalova Veteranlar Ligi</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap" rel="stylesheet">
<style id="css">
:root{--bg:#0a1226;--card:#111b38;--card2:#18254b;--line:#27365f;--txt:#eef1f7;--mut:#97a3bf;--gold:#8da4cf;--ink:#0a1226;--red:#b8636e;--grn:#5a9c7a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--disp:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif;--cond:Montserrat,system-ui,-apple-system,"Segoe UI",sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5}

.hero{display:flex;align-items:center;gap:12px;padding:10px 16px;background:linear-gradient(100deg,#0d1a3d,#142a5c);border-bottom:1px solid var(--line)}
.hero .mark{flex:none;height:58px;width:auto;background:#fff;border-radius:8px;padding:3px;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.hero .sp{flex:none;height:34px;width:auto;margin-left:auto;opacity:.92}
.hero .y{font-weight:800;font-size:20px;line-height:1;letter-spacing:.04em;margin:0;color:#fff}
.hero .v{font-weight:600;font-size:10px;letter-spacing:.3em;color:var(--mut);margin-top:4px}
nav{display:flex;gap:2px;overflow-x:auto;padding:0 8px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(10,18,38,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:.04em;text-transform:uppercase;background:transparent;color:var(--mut);border:0;border-bottom:2px solid transparent;padding:11px 12px;cursor:pointer;display:flex;align-items:center;gap:7px;transition:.15s}
nav button i{display:flex;font-style:normal}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--gold)}
nav button.on i{color:var(--gold)}

.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 8px 12px;text-align:center;cursor:pointer;transition:.15s;color:inherit;font:inherit}
.tcard:hover{border-color:var(--gold);transform:translateY(-2px)}
.tcard .logo{width:64px;height:64px;margin:0 auto 10px;border-radius:10px}
.tcard b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.03em;line-height:1.3;min-height:2.6em}
.tcard small{color:var(--mut);font-size:11px}
.back{background:none;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:6px 12px;font:600 12px var(--disp);cursor:pointer;display:inline-flex;align-items:center;gap:6px;margin-bottom:12px}
.thead{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.thead .logo{width:76px;height:76px;border-radius:12px}
.thead h3{margin:0;font-size:18px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:12px}
.info div{background:var(--card2);border-radius:6px;padding:8px 10px;font-size:13px}
.info small{display:block;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
[data-team]{cursor:pointer}
.rule h3{margin:0 0 10px;color:#fff}
.rule h3 svg{color:var(--gold);width:18px;height:18px}
.rule ul{margin:0;padding:0;list-style:none}
.rule li{position:relative;padding:7px 0 7px 18px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px}
.rule li:last-child{border:0}
.rule li:before{content:"";position:absolute;left:2px;top:15px;width:6px;height:6px;background:var(--gold);border-radius:1px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px}
.kpis div{background:var(--card2);border-radius:8px;padding:10px 6px;text-align:center}
.kpis b{display:block;font:800 22px var(--disp);color:#fff}
.kpis small{color:var(--mut);font-size:11px;line-height:1.3;display:block}
.rule table{min-width:0;font-size:13px;margin:4px 0 8px}
.rule td,.rule th{padding:8px 4px}
.note{background:rgba(141,164,207,.1);border-left:3px solid var(--gold);border-radius:4px;padding:8px 12px;font-size:13px;color:var(--mut);margin-top:6px}
.warn{border-left-color:var(--red)}
main{max-width:900px;margin:0 auto;padding:12px}
section{display:none}section.on{display:block}
h2{font-family:var(--disp);font-weight:800;font-size:17px;letter-spacing:.04em;text-transform:uppercase;margin:4px 0 12px;color:#fff;display:flex;align-items:center;gap:10px}
h2:before{content:"";width:3px;height:18px;background:var(--gold)}
h3{font-family:var(--cond);font-size:14px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:start;gap:6px 6px;padding:12px 2px;border-bottom:1px solid rgba(255,255,255,.07)}
.match:last-child{border:0}
.slot{grid-column:1/-1;justify-self:center;font-family:var(--disp);font-weight:700;font-size:11px;letter-spacing:.04em;color:var(--ink);background:var(--gold);padding:2px 12px;border-radius:3px}
.mt{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.mt span.n{font-family:var(--cond);font-weight:600;font-size:12px;line-height:1.25;text-transform:uppercase;min-height:2.5em;display:flex;align-items:center;justify-content:center}
.mt .logo{width:46px;height:46px}
.match .sc{align-self:center}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm.r{justify-content:flex-end;text-align:right}
.tm span.n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase}
.logo{flex:none;width:28px;height:28px;border-radius:7px;background:#1b2c5c;border:1px solid rgba(255,255,255,.2);display:block;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.sc{font-family:var(--disp);font-weight:800;font-size:15px;background:var(--bg);border:1px solid var(--line);padding:2px 10px;min-width:56px;text-align:center;border-radius:4px;color:#fff}
.weeks{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}
.weeks button{flex:none;font-family:var(--disp);font-weight:700;font-size:13px;background:var(--card);color:var(--mut);border:1px solid var(--line);padding:6px 12px;cursor:pointer;border-radius:6px;font-size:12px}
.weeks button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:520px;font-family:var(--cond);font-size:14px;font-weight:600}
th,td{padding:7px 5px;text-align:center;border-bottom:1px solid rgba(255,255,255,.08)}
th{color:var(--gold);font-family:var(--disp);font-weight:700;font-size:12px;letter-spacing:.06em}
td.t{text-align:left;text-transform:uppercase}
tr.up td:first-child{border-left:4px solid var(--grn)}
tr.dn td:first-child{border-left:4px solid var(--red)}
tr.dn{background:rgba(184,99,110,.08)}
.leg{font-size:13px;color:var(--mut);margin-top:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ph{aspect-ratio:16/10;border:2px dashed var(--line);border-radius:6px;display:grid;place-items:center;color:var(--mut);font-family:var(--cond);font-size:15px;text-align:center;padding:8px;background:rgba(24,37,75,.5)}
.empty{color:var(--mut);text-align:center;padding:18px}
.vs{color:var(--mut);font-family:var(--cond);font-size:15px}
.rl li{margin-bottom:8px}
.po{display:grid;gap:10px}
.po .m{display:flex;justify-content:space-between;gap:8px;background:var(--card2);padding:10px 14px;font-family:var(--cond);font-weight:700;font-size:14px;text-transform:uppercase;border-left:3px solid var(--gold);border-radius:4px}
.badge{display:inline-block;font-family:var(--disp);font-weight:700;background:var(--gold);color:var(--ink);padding:1px 9px;font-size:11px;border-radius:3px}
footer{text-align:center;color:var(--mut);padding:28px;font-family:var(--cond);letter-spacing:.1em}

.btn{font:600 13px var(--disp);background:var(--card2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:8px 14px;cursor:pointer}
.btn.pri{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.btn.sm{padding:4px 10px;font-size:12px}
.btn.del{color:var(--red)}
.btn:disabled{opacity:.4;cursor:default}
#admin input,#admin select{background:var(--bg);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:8px 10px;font:inherit;font-size:14px;min-width:0}
.arow{display:grid;grid-template-columns:44px 1fr 54px 10px 54px 1fr;gap:6px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:13px;text-transform:uppercase;font-family:var(--cond);font-weight:600}
.arow:last-child{border:0}
.arow input{text-align:center;padding:6px 2px!important}
.arow .r{text-align:right}
.tmx{font-size:11px;color:var(--gold);font-weight:700}
.form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.form input,.form select{flex:1 1 120px}
.form.col{flex-direction:column}.form.col label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mut)}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
.lrow:last-child{border:0}
.ctl{display:flex;align-items:center;gap:8px;flex:none}
.chips2{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{background:var(--card2);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}
.chip.bad,.neg{color:var(--red)}
.chip.bad{border:1px solid var(--red)}
.pbar{position:sticky;bottom:calc(env(safe-area-inset-bottom,0px) + 8px);display:flex;justify-content:space-between;align-items:center;gap:10px;background:#0d1a3d;border:1px solid var(--gold);border-radius:10px;padding:10px 14px;font-size:13px;margin-top:14px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
</style></head><body><template id="skel">

<ul><li>Maç kadrosuna en fazla <b>15 oyuncu</b> yazılabilir.</li><li>Takımın toplam lisanslı oyuncu hakkı <b>1</b>'dir.</li><li>Kalecilerde yaş sınırı yoktur.</li><li>Her oyuncunun doğum tarihi, bulunduğu yaş grubunun başlangıç tarihi ya da öncesinde olmalıdır.</li><li>Kalan 11 oyuncunun tamamı 39 yaş üstü olmak zorundadır.</li><li>Yaş sınırından muaf (serbest) kaleci, sahada oyuncu olarak oynayamaz.</li></ul></div>

<div class="card rule"><h3 data-ic="clock">Maç Süresi</h3>
<div class="kpis"><div><b>2x23</b><small>dakika, iki devre</small></div><div><b>2 dk</b><small>devre arası mola</small></div><div><b>4 dk</b><small>ısınma süresi</small></div></div>
<ul><li>Maçlar 23 dakikalık iki devre olarak oynanır.</li><li>Devreler arasında 2 dakika mola verilir.</li><li>Her takıma maç öncesi ısınmak için 4 dakika tanınır.</li><li>Değişiklik sınırsızdır, ancak oyundan çıkan oyuncu tekrar oyuna giremez.</li></ul></div>

<div class="card rule"><h3 data-ic="eye">Hakemler ve VAR</h3>
<ul><li>Maçlar, Yalova İl Hakem Kurulu tarafından atanan hakemlerce yönetilir.</li><li>Organizasyon, profesyonel desteği Türkiye Futbol Federasyonu'ndan alır.</li><li>Winner Sport organizasyonu, hakem kararlarına ve hakemlerle ilgili hiçbir konuya karışmaz; hakemlerle bir bağı yoktur.</li><li>Maçlarda VAR sistemi vardır. Oyuncu hakemden izlemesini isterse hakem gelip görüntüye bakar.</li><li>Hakem dilerse kendisi de maçı durdurup görüntüyü izleyebilir.</li></ul></div>

<div class="card rule"><h3 data-ic="shield">Disiplin Kuralları</h3>
<ul><li>Hakeme fiziksel veya sözlü müdahale, önce oyuncunun ardından takımın diskalifiye sebebidir.</li><li>Turnuvayı aşağılayan ve ortamın huzurunu bozan kişiler, ardından takımları turnuvadan men edilir.</li><li>Küfür, tehdit ve saldırgan tavırlar turnuvadan men sebebidir.</li><li>Kırmızı kart gören oyuncunun cezası, organizasyon komitesi tarafından maçtan bir gün sonra açıklanır.</li></ul></div>

<div class="card rule"><h3 data-ic="wallet">Ücret ve Ödeme</h3>
<ul><li>Maç ücreti <b>1.750 ₺</b>'dir.</li><li>Ücret, maçtan önce Fatih Halısaha'ya ödenmelidir.</li></ul>
<div class="note warn">Ödeme yapılmazsa takım maça çıkamaz ve hükmen <b>5-0</b> mağlup sayılır.</div></div>

<div class="card rule"><h3 data-ic="file">İtiraz ve Yetki</h3>
<ul><li>İtirazlar, maç bitiminden itibaren <b>2 saat içinde</b> yazılı dilekçeyle Winner Sport komitesine iletilmelidir.</li><li>Süresi içinde yapılmayan itiraz geçerli sayılmaz.</li><li>Winner Sport, organizasyonda tek yetkilidir.</li><li>Turnuvayla ilgili her türlü değişikliği yapma hakkı Winner Sport'a aittir.</li></ul></div>

<div class="card rule"><h3 data-ic="po">Turnuva Formatı</h3>
<ul><li>10 takım tek devre lig usulü oynar; herkes birbiriyle bir kez eşleşir.</li><li>İlk 8 takım üst tura çıkar, 9. ve 10. takım elenir.</li><li>Üst tur eşleşmeleri 1-8, 2-7, 3-6 ve 4-5 şeklindedir. Ardından yarı final ve final oynanır.</li><li>Tüm maçlar yalnızca pazartesi günleri oynanır.</li></ul></div></section>

TEAMS.forEach(t=>{const l=LOGOS[t.id];t.logo="data:image/jpeg;base64,"+l.b;t.bg=l.c;});
const SLOTS=["18:00 - 19:00","19:00 - 20:00","20:00 - 21:00","21:00 - 22:00","22:00 - 23:00"];
const START=new Date(2026,10,23); // 23 Kasım 2026 Pazartesi
/* Skor girişi: anahtar "hafta-maçNo" (ör. "1-0"), değer {h:ev, a:deplasman} */
const RESULTS=S.results||(S.results={});
/* Gol krallığı: {p:"Oyuncu",t:"takım id",g:gol} */
const GOALS=S.goals||(S.goals=[]);

/* ===== FİKSTÜR ÜRETİMİ (çember yöntemi + adil saat dağılımı) ===== */
const T=Object.fromEntries(TEAMS.map(t=>[t.id,t]));
const order=["idman","kurtkoy","hakan","bas","subasi","unique","cinar","candas","kaytaz","bad"];
// 1. hafta: İdman Yurdu - Badboys karşılaşması en uç eşleşme olsun
let arr=order.slice(),rounds=[];
for(let r=0;r<9;r++){
 const ms=[];for(let i=0;i<5;i++){ms.push(r%2? [arr[9-i],arr[i]]:[arr[i],arr[9-i]]);}
 rounds.push(ms);
 arr=[arr[0],arr[9],...arr.slice(1,9)];
}
function perms(a){if(a.length<2)return[a];return a.flatMap((x,i)=>perms([...a.slice(0,i),...a.slice(i+1)]).map(p=>[x,...p]));}
const P=perms([0,1,2,3,4]);
const cnt={};order.forEach(t=>cnt[t]=[0,0,0,0,0]);
const FIX=rounds.map((ms,w)=>{
 let best=null,bs=1e9;
 ms.forEach(m=>{}); 
 const isFirst=w===0;
 const idx=isFirst?ms.findIndex(m=>m.includes("idman")&&m.includes("bad")):-1;
 for(const p of P){ // p[i] = slot of match i
  if(isFirst&&p[idx]!==3)continue;
  let s=0;
  ms.forEach((m,i)=>m.forEach(t=>{const c=cnt[t].slice();c[p[i]]++;s+=c.reduce((a,b)=>a+b*b,0)+ (cnt[t][p[i]]>=2?50:0);}));
  if(s<bs){bs=s;best=p;}
 }
 const out=ms.map((m,i)=>({h:m[0],a:m[1],s:best[i],k:w+"-"+i,w}));
 out.forEach(o=>{cnt[o.h][o.s]++;cnt[o.a][o.s]++;});
 out.sort((x,y)=>x.s-y.s);
 // anahtar sırası saat sırasına göre sabitle
 out.forEach((o,i)=>o.k=w+"-"+i);
 return out;
});
const wdate=w=>{const d=new Date(START);d.setDate(d.getDate()+7*w);return d;};
const fmt=d=>d.toLocaleDateString("tr-TR",{day:"numeric",month:"long",year:"numeric",weekday:"long"});

/* ===== YARDIMCILAR ===== */
const $=id=>document.getElementById(id);
const ini=n=>n.split(" ").map(x=>x[0]).join("").slice(0,3).toUpperCase();
const logo=t=>`<span class="logo" style="background:${t.bg||""}"><img src="${t.logo}" alt="${t.n}"></span>`;
function matchRow(m){
 const r=RESULTS[m.k],H=T[m.h],A=T[m.a];
 return `<div class="match"><div class="slot">${SLOTS[m.s]}</div><div class="mt" data-team="${H.id}">${logo(H)}<span class="n">${H.n}</span></div><div class="sc">${r?r.h+" - "+r.a:"vs"}</div><div class="mt" data-team="${A.id}">${logo(A)}<span class="n">${A.n}</span></div></div>`;
}
function standings(){
 const s={};TEAMS.forEach(t=>s[t.id]={id:t.id,o:0,g:0,b:0,m:0,ag:0,yg:0,p:0});
 FIX.flat().forEach(m=>{const r=RESULTS[m.k];if(!r)return;const H=s[m.h],A=s[m.a];
  H.o++;A.o++;H.ag+=r.h;H.yg+=r.a;A.ag+=r.a;A.yg+=r.h;
  if(r.h>r.a){H.g++;A.m++;H.p+=3}else if(r.h<r.a){A.g++;H.m++;A.p+=3}else{H.b++;A.b++;H.p++;A.p++}});
 return Object.values(s).sort((a,b)=>b.p-a.p||(b.ag-b.yg)-(a.ag-a.yg)||b.ag-a.ag||T[a.id].n.localeCompare(T[b.id].n,"tr"));
}

0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"/>'),crown:I('<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/><path d="M5 20h14"/>'),shield:I('<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/>'),ball:I('<circle cx="12" cy="12" r="10"/><path d="m12 8 3.5 2.5-1.3 4h-4.4l-1.3-4z"/>'),cam:I('<path d="M13.997 4a2 2 0 0 1 1.76 1.05l.486.9A2 2 0 0 0 18.003 7H20a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h1.997a2 2 0 0 0 1.759-1.048l.489-.904A2 2 0 0 1 10.004 4z"/><circle cx="12" cy="13" r="3"/>')};
const PAGES=[["home","Ana Sayfa","home"],["fix","Fikstür","fix"],["tab","Puan Durumu","tab"],["teams","Takımlar","team"],["stat","İstatistik","stat"],["po","Üst Tur","po"],["media","Medya","media"],["rules","Kurallar","rules"],["admin","Yönetici","lock"]];
$("nav").innerHTML=PAGES.map(p=>`<button data-p="${p[0]}"><i>${ICON[p[2]]}</i><span>${p[1]}</span></button>`).join("");
function show(id,sc){
 if(id==="admin")openAdmin();document.querySelectorAll("section").forEach(s=>s.classList.toggle("on",s.id===id));
 document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.p===id));if(sc)scrollTo(0,document.querySelector("nav").offsetTop-10);}
$("nav").onclick=e=>{const b=e.target.closest("button");if(b){if(b.dataset.p==="teams")drawTeams();show(b.dataset.p,1)}};

// Fikstür
let cur=0;
function drawWeek(){
 $("weeks").innerHTML=FIX.map((_,w)=>`<button class="${w===cur?"on":""}" data-w="${w}">${w+1}. Hafta</button>`).join("");
 $("wk").innerHTML=`<div style="margin-bottom:8px"><span class="badge">${cur+1}. HAFTA</span> <span class="vs">${fmt(wdate(cur))}</span></div>`+FIX[cur].map(matchRow).join("");

// Ana sayfa

let nw=FIX.findIndex((_,w)=>wdate(w)>=today);if(nw<0)nw=0;

$("home").innerHTML=`<div class="card"><span class="badge">SIRADAKİ HAFTA</span> <b>${nw+1}. Hafta</b><div class="vs" style="margin-bottom:6px">${fmt(wdate(nw))}</div>${sameDay.map(matchRow).join("")}</div>
<div class="card"><b>Lig Formatı</b><ul class="rl"><li>10 takım, tek devre: herkes herkesle bir kez oynar (9 hafta).</li><li>İlk 8 takım üst tura çıkar, 9. ve 10. elenir.</li><li>Çeyrek final: 1-8, 2-7, 3-6, 4-5 eşleşir; sonra yarı final ve final.</li><li>Tüm maçlar yalnızca pazartesi günleri oynanır.</li></ul></div>`;

$("table").innerHTML=`<table><tr><th>#</th><th style="text-align:left">Takım</th><th>O</th><th>G</th><th>B</th><th>M</th><th>AG</th><th>YG</th><th>AV</th><th>P</th></tr>`+
 st.map((r,i)=>`<tr data-team="${r.id}" class="${i<8?"up":"dn"}"><td>${i+1}</td><td class="t"><div class="tm">${logo(T[r.id])}<span class="n">${T[r.id].n}</span></div></td><td>${r.o}</td><td>${r.g}</td><td>${r.b}</td><td>${r.m}</td><td>${r.ag}</td><td>${r.yg}</td><td>${r.ag-r.yg}</td><td><b>${r.p}</b></td></tr>`).join("")+`</table>`;

// İstatistik
const gs=GOALS.slice().sort((a,b)=>b.g-a.g);
$("scorers").innerHTML=gs.length?`<table style="min-width:0"><tr><th>#</th><th style="text-align:left">Oyuncu</th><th style="text-align:left">Takım</th><th>Gol</th></tr>`+gs.map((x,i)=>`<tr><td>${i+1}</td><td class="t">${x.p}</td><td class="t">${T[x.t].n}</td><td><b>${x.g}</b></td></tr>`).join("")+`</table>`:`<div class="empty">Henüz gol kaydedilmedi. Gol krallığı ilk maçlardan sonra burada olacak.</div>`;

$("tstats").innerHTML=played?`<p style="display:flex;align-items:center;gap:8px"><span style="color:var(--gold)">${ICON.ball}</span> En çok gol atan: <b>${T[byAtt[0].id].n}</b> (${byAtt[0].ag})</p><p style="display:flex;align-items:center;gap:8px"><span style="color:var(--gold)">${ICON.shield}</span> En az gol yiyen: <b>${T[byDef[0].id].n}</b> (${byDef[0].yg})</p>`:`<div class="empty">Maçlar oynandıkça takım istatistikleri burada görünecek.</div>`;

<div class="card"><b>Yarı Final</b><div class="po" style="margin-top:8px"><div class="m"><span>1-8 galibi</span><span class="vs">vs</span><span>4-5 galibi</span></div><div class="m"><span>2-7 galibi</span><span class="vs">vs</span><span>3-6 galibi</span></div></div></div>
<div class="card"><b>Final</b><div class="po" style="margin-top:8px"><div class="m"><span>Yarı final 1 galibi</span><span class="vs">vs</span><span>Yarı final 2 galibi</span></div></div></div>
<p class="leg">Üst tur maçları da pazartesi günleri oynanır. Tarihler lig bitince netleşecek.</p>`;

// Medya
$("mg").innerHTML=Array.from({length:6},(_,i)=>`<div class="ph">${ICON.cam}&nbsp; Medya ${i+1}</div>`).join("");


/* ===== TAKIMLAR ===== */
/* Takım bilgisi: INFO.id = {kurulus:"1985", baskan:"Ad Soyad", teknik:"Ad Soyad"} */
const INFO=S.info||(S.info={});
/* Oyuncu listesi: PLAYERS.id = [{no:10, ad:"Ad Soyad", mevki:"Forvet", dt:"1982-05-14"}]  (dt: YYYY-AA-GG) */
const PLAYERS=S.players=Object.fromEntries(TEAMS.map(t=>[t.id,(S.players&&S.players[t.id])||[]]));
const age=d=>{const b=new Date(d),n=new Date();let a=n.getFullYear()-b.getFullYear();if(n<new Date(n.getFullYear(),b.getMonth(),b.getDate()))a--;return isNaN(a)?"-":a};
const fd=d=>{const p=(d||"").split("-");return p.length===3?`${p[2]}.${p[1]}.${p[0]}`:"-"};
function drawTeams(){
 $("tl").innerHTML=`<div class="tgrid">`+TEAMS.map(t=>`<button class="tcard" data-team="${t.id}">${logo(t)}<b>${t.n}</b><small>${PLAYERS[t.id].length} oyuncu</small></button>`).join("")+`</div>`;
}
function showTeam(id){
 const t=T[id],pl=PLAYERS[id].slice().sort((a,b)=>(a.no||99)-(b.no||99)),inf=INFO[id]||{};
 const g=n=>GOALS.filter(x=>x.t===id&&x.p===n).reduce((a,b)=>a+b.g,0);
 const rs=st.findIndex(r=>r.id===id);
 $("tl").innerHTML=`<button class="back" data-back="1">${ICON.back} Tüm takımlar</button>
 <div class="card"><div class="thead">${logo(t)}<div><h3>${t.n}</h3><span class="vs">${played?rs+1+". sırada":"Lig henüz başlamadı"}</span></div></div>
 <div class="info"><div><small>Kuruluş</small>${inf.kurulus||"-"}</div><div><small>Başkan</small>${inf.baskan||"-"}</div><div><small>Teknik sorumlu</small>${inf.teknik||"-"}</div><div><small>Oyuncu sayısı</small>${pl.length}</div></div></div>
 <div class="card tw"><h3 style="margin-top:0">Kadro</h3>${pl.length?`<table style="min-width:440px"><tr><th>No</th><th style="text-align:left">Ad Soyad</th><th>Mevki</th><th>Doğum Tarihi</th><th>Yaş</th><th>Gol</th></tr>`+pl.map(p=>`<tr><td>${p.no||"-"}</td><td class="t">${p.ad}</td><td>${p.mevki||"-"}</td><td>${fd(p.dt)}</td><td>${p.dt?age(p.dt):"-"}</td><td>${g(p.ad)}</td></tr>`).join("")+`</table>`:`<div class="empty">Kadro bilgileri yakında eklenecek.</div>`}</div>`;
}
document.addEventListener("click",e=>{
 if(e.target.closest("[data-back]")){drawTeams();return}
 const el=e.target.closest("[data-team]");if(el){show("teams",1);showTeam(el.dataset.team)}
});
drawTeams();
$("ic1").innerHTML=ICON.crown;
document.querySelectorAll("[data-ic]").forEach(e=>{e.innerHTML=ICON[e.dataset.ic]+" "+e.innerHTML});

/* ===== YÖNETİCİ PANELİ ===== */
const adm={tab:"skor",w:Math.min(nw,8),team:TEAMS[0].id,dirty:false,ok:false,msg:"",unlocked:(()=>{try{return sessionStorage.getItem("au")==="1"}catch(e){return false}})()};
const POS=["Kaleci","Defans","Orta Saha","Forvet"];
const GL={"33-35":1,"35-39":3,"39+":11};
const grp=d=>!d?"":d<="1987-12-31"?"39+":d<="1992-12-31"?"35-39":d<="1994-12-31"?"33-35":"uygun değil";
const esc=x=>String(x==null?"":x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const tOpts=()=>TEAMS.map(t=>`<option value="${t.id}"${t.id===adm.team?" selected":""}>${t.n}</option>`).join("");
function counts(id){const c={"33-35":0,"35-39":0,"39+":0};PLAYERS[id].forEach(p=>{if(p.mevki==="Kaleci")return;const g=grp(p.dt);if(c[g]!==undefined)c[g]++});return c}
function bar(){const b=$("pbar");if(!b)return;b.innerHTML=`<span>${adm.msg||(adm.dirty?"Yayınlanmamış değişiklikler var.":"Tüm değişiklikler yayında.")}</span><button class="btn pri" data-act="pub" ${adm.dirty?"":"disabled"}>Yayınla</button>`}
function aSkor(){
 const wk=`<div class="weeks">`+FIX.map((_,w)=>`<button class="${w===adm.w?"on":""}" data-act="aweek" data-v="${w}">${w+1}. Hafta</button>`).join("")+`</div>`;
 const rows=FIX[adm.w].map(m=>{const r=RESULTS[m.k];return `<div class="arow" data-row="${m.k}"><span class="tmx">${SLOTS[m.s].slice(0,5)}</span><span class="r">${T[m.h].n}</span><input type="number" min="0" inputmode="numeric" data-s="h" value="${r?r.h:""}"><b>-</b><input type="number" min="0" inputmode="numeric" data-s="a" value="${r?r.a:""}"><span>${T[m.a].n}</span></div>`}).join("");
 return wk+`<div class="card"><div class="vs" style="margin-bottom:6px">${fmt(wdate(adm.w))}. Her iki skoru da girince kaydedilir, boş bırakılan maç oynanmamış sayılır.</div>${rows}</div>`;
}
function aGol(){
 const roster=PLAYERS[adm.team].map(p=>`<option value="${esc(p.ad)}">`).join("");
 const list=GOALS.map((x,i)=>({x,i})).sort((a,b)=>b.x.g-a.x.g).map(({x,i})=>`<div class="lrow"><span><b>${esc(x.p)}</b> <small class="vs">${T[x.t].n}</small></span><span class="ctl"><button class="btn sm" data-act="gdec" data-i="${i}">−</button><b>${x.g}</b><button class="btn sm" data-act="ginc" data-i="${i}">+</button><button class="btn sm del" data-act="gdel" data-i="${i}">Sil</button></span></div>`).join("")||`<div class="empty">Henüz gol girilmedi.</div>`;
 return `<div class="card"><h3 style="margin-top:0">Gol ekle</h3><div class="form"><select data-team-sel>${tOpts()}</select><input id="gp" list="rs" placeholder="Oyuncu adı"><datalist id="rs">${roster}</datalist><input id="gn" type="number" min="1" value="1"><button class="btn pri" data-act="gadd">Ekle</button></div></div><div class="card"><h3 style="margin-top:0">Gol krallığı listesi</h3>${list}</div>`;
}
function aOyuncu(){
 const id=adm.team,c=counts(id),pl=PLAYERS[id];
 const chip=k=>`<span class="chip ${c[k]>GL[k]?"bad":""}">${k} yaş: ${c[k]}/${GL[k]}</span>`;
 const list=pl.map((p,i)=>{const g=p.mevki==="Kaleci"?"yaş serbest":grp(p.dt);return `<div class="lrow"><span><b>${p.no||"-"}</b> ${esc(p.ad)}<br><small class="vs">${esc(p.mevki)} · ${fd(p.dt)} · ${p.dt?age(p.dt)+" yaş":"-"} · <span class="${g==="uygun değil"?"neg":""}">${g}</span></small></span><button class="btn sm del" data-act="pdel" data-i="${i}">Sil</button></div>`}).join("")||`<div class="empty">Bu takımda oyuncu yok.</div>`;
 return `<div class="card"><select data-team-sel>${tOpts()}</select><div class="chips2">${chip("33-35")}${chip("35-39")}${chip("39+")}<span class="chip ${pl.length>15?"bad":""}">Kadro: ${pl.length}/15</span></div></div>
 <div class="card"><h3 style="margin-top:0">Oyuncu ekle</h3><div class="form"><input id="pn" type="number" min="1" placeholder="Forma no"><input id="pa" placeholder="Ad Soyad"><select id="pm">${POS.map(x=>`<option>${x}</option>`).join("")}</select><input id="pd" type="date"><button class="btn pri" data-act="padd">Ekle</button></div></div>
 <div class="card"><h3 style="margin-top:0">Kadro</h3>${list}</div>`;
}
function aBilgi(){const inf=INFO[adm.team]||{};
 return `<div class="card"><select data-team-sel>${tOpts()}</select><div class="form col"><label>Kuruluş yılı<input data-info="kurulus" value="${esc(inf.kurulus)}"></label><label>Başkan<input data-info="baskan" value="${esc(inf.baskan)}"></label><label>Teknik sorumlu<input data-info="teknik" value="${esc(inf.teknik)}"></label></div></div>`}
const AH="eaac22ec9f1649dc2a4c6f23b39cb82724734dae69f4a0a8157c833aff22c13f";
async function sha(t){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function drawGate(msg){
 $("admin").innerHTML=`<h2>Yönetici Girişi</h2><div class="card"><p class="vs" style="margin-top:0">Devam etmek için şifreyi gir.</p><div class="form"><input id="apw" type="password" placeholder="Şifre" autocomplete="off"><button class="btn pri" id="agate">Giriş</button></div>${msg?`<p class="neg" style="margin:10px 0 0;font-size:13px">${msg}</p>`:""}</div>`;
 const go=async()=>{let ok=false;try{ok=(await sha($("apw").value))===AH}catch(e){}
  if(ok){adm.unlocked=true;try{sessionStorage.setItem("au","1")}catch(e){}openAdmin()}else drawGate("Şifre yanlış.")};
 $("agate").onclick=go;$("apw").onkeydown=e=>{if(e.key==="Enter")go()};
}
function drawAdmin(){
 const el=$("admin");
 if(!adm.ok){el.innerHTML=`<h2>Yönetici</h2><div class="card"><p style="margin-top:0">Bu bölüm yalnızca site yöneticisine açıktır.</p><p class="vs" style="margin-bottom:0">Yönetici olarak düzenleme yapmak için sayfayı, sahibi olduğun claude.ai hesabıyla giriş yaparak aç.</p></div>`;return}
 const tabs=[["skor","Skorlar"],["gol","Gol Krallığı"],["oyuncu","Oyuncular"],["bilgi","Takım Bilgisi"]];
 el.innerHTML=`<h2>Yönetici Paneli</h2><div class="weeks">`+tabs.map(t=>`<button class="${t[0]===adm.tab?"on":""}" data-act="atab" data-v="${t[0]}">${t[1]}</button>`).join("")+`</div>`+({skor:aSkor,gol:aGol,oyuncu:aOyuncu,bilgi:aBilgi}[adm.tab])()+`<div class="pbar" id="pbar"></div>`;
 bar();
}
async function openAdmin(){
 if(!adm.unlocked){drawGate();return}
 let u=null;try{u=await claude.use("user")}catch(e){}
 try{adm.ok=!!(u&&u.canEdit&&await u.canEdit())}catch(e){adm.ok=false}
 drawAdmin();
}
function buildHTML(){
 const st=JSON.stringify(S).replace(/</g,"\\u003c");
 return "<!doctype html>\n<html lang=\"tr\"><head>"+HEAD+"<style id=\"css\">"+document.getElementById("css").textContent+"</style></head><body><template id=\"skel\">"+document.getElementById("skel").innerHTML+"</template><script id=\"state\" type=\"application/json\">"+st+"<\/script><script id=\"app\">"+document.getElementById("app").textContent+"<\/script></body></html>";
}
async function publishAll(){
 let art=null;try{art=await claude.use("artifact")}catch(e){}
 if(!art){adm.msg="Kaydetme bu görünümde kullanılamıyor.";bar();return}
 adm.msg="Yayınlanıyor…";bar();
 try{sessionStorage.setItem("tab","admin")}catch(e){}
 try{await art.publish(buildHTML())}
 catch(e){const c=e&&e.code;adm.msg=(c==="not_writer"||c==="not_granted")?"Yayınlama yetkin yok. Sahibi hesabıyla giriş yap.":c==="conflict"?"Sayfa güncellendi, yeniden yükleniyor…":"Yayınlanamadı, tekrar dene.";bar()}
}
const dirty=()=>{adm.dirty=true;adm.msg="";bar()};
$("admin").addEventListener("click",async e=>{
 const b=e.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act,i=+b.dataset.i;adm.msg="";
 if(a==="pub"){await publishAll();return}
 if(a==="atab")adm.tab=b.dataset.v;
 else if(a==="aweek")adm.w=+b.dataset.v;
 else if(a==="gadd"){const p=$("gp").value.trim(),n=+$("gn").value||1;if(!p){adm.msg="Oyuncu adı yaz.";}else{const x=GOALS.find(g=>g.p===p&&g.t===adm.team);if(x)x.g+=n;else GOALS.push({p,t:adm.team,g:n});adm.dirty=true}}
 else if(a==="ginc"){GOALS[i].g++;adm.dirty=true}
 else if(a==="gdec"){GOALS[i].g--;if(GOALS[i].g<1)GOALS.splice(i,1);adm.dirty=true}
 else if(a==="gdel"){GOALS.splice(i,1);adm.dirty=true}
 else if(a==="padd"){const ad=$("pa").value.trim();if(!ad){adm.msg="Ad soyad yaz.";}else{PLAYERS[adm.team].push({no:+$("pn").value||0,ad,mevki:$("pm").value,dt:$("pd").value});PLAYERS[adm.team].sort((x,y)=>(x.no||99)-(y.no||99));adm.dirty=true}}
 else if(a==="pdel"){PLAYERS[adm.team].splice(i,1);adm.dirty=true}
 drawAdmin();
});
$("admin").addEventListener("change",e=>{
 const t=e.target;
 if(t.matches("[data-team-sel]")){adm.team=t.value;drawAdmin();return}
 if(t.dataset.info){(INFO[adm.team]=INFO[adm.team]||{})[t.dataset.info]=t.value.trim();dirty();return}
 const row=t.closest("[data-row]");
 if(row){const h=row.querySelector('[data-s="h"]').value,a=row.querySelector('[data-s="a"]').value,k=row.dataset.row;
  if(h===""&&a==="")delete RESULTS[k];else if(h!==""&&a!=="")RESULTS[k]={h:+h,a:+a};else return;dirty()}
});
let tab0="home";try{tab0=sessionStorage.getItem("tab")||"home";sessionStorage.removeItem("tab")}catch(e){}
show(tab0);
</script></body></html>
